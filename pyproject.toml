[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".fs-python", "dev-wheels", "wheels"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF"]
ignore = ["E501"]

# The Flow Steward extension gate runs mypy from this folder: the SDK wheel is
# untyped, and modules are named from this folder (it has an __init__.py).
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(^\\.fs-python/|^dev-wheels/|^wheels/)"
