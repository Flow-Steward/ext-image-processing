actions:
- action_id: upscale
  title: Resize an image or fit it to a canvas
  description: Resize an image proportionally within pixel bounds using Lanczos interpolation, or center it on an
    exact-size canvas. Returns a PNG artifact without stretching or cropping; smaller bounds reduce the image and
    enlargement does not recover missing detail.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: artifact_handle
    type: artifact_handle
    required: true
  - name: target_width
    type: integer
    required: false
  - name: target_height
    type: integer
    required: false
  - name: resize_mode
    type: string
    required: false
  - name: canvas_color
    type: string
    required: false
  result_fields: &id001
  - image_artifact_handle
  - width
  - height
  - original_width
  - original_height
  - has_transparency
  - processing_method
  - size_bytes
- action_id: remove_background
  title: Remove an image background
  description: Use the bundled U2-NetP CPU model to create a transparent PNG at the source dimensions. Existing
    transparency can be preserved without running segmentation; inspect difficult edges before use.
  required_scopes:
  - extension:invoke
  - artifact:read
  - artifact:write
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: artifact_handle
    type: artifact_handle
    required: true
  - name: keep_existing_transparency
    type: boolean
    required: false
  result_fields: *id001
- action_id: check_size
  title: Inspect image dimensions
  description: Read an image artifact and compare it with target dimensions. Returns dimensions and resize/padding
    flags for workflow branching without creating a new image.
  required_scopes:
  - extension:invoke
  - artifact:read
  handler:
    mode: extension
  mutates_platform: false
  workflow_visible: true
  parameters:
  - name: artifact_handle
    type: artifact_handle
    required: true
  - name: target_width
    type: integer
    required: false
  - name: target_height
    type: integer
    required: false
  result_fields:
  - width
  - height
  - target_width
  - target_height
  - exact_match
  - fits_within_target
  - needs_resize
  - needs_padding
  - recommended_resize_mode
