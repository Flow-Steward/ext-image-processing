    type: markdown
    body: |
      ## Image Processing

      Local image processing. No API key or external image service.

      | Action | Output |
      | --- | --- |
      | Resize an image or fit it to a canvas | Proportional PNG at the requested pixel bounds |
      | Inspect image dimensions | Dimensions and resize/padding flags; no new artifact |
      | Remove an image background | Transparent PNG at the original dimensions |
