operations:
- operation_id: upscale
  display_name: Resize an image or fit it to a canvas
  description: Resize an image proportionally within pixel bounds using Lanczos interpolation, or center it on an
    exact-size canvas. Returns a PNG artifact without stretching or cropping; smaller bounds reduce the image and
    enlargement does not recover missing detail.
  operation_kind: action
  category: image_processing
  connection_type_ids: []
  inputs:
  - name: artifact_handle
    value_type: artifact_handle
    required: true
    display_name: Source image artifact
  - name: target_width
    value_type: number
    schema:
      type: number
      minimum: 1
      maximum: 8192
    display_name: Target width (pixels)
  - name: target_height
    value_type: number
    schema:
      type: number
      minimum: 1
      maximum: 8192
    display_name: Target height (pixels)
  - name: resize_mode
    value_type: text
    schema:
      type: string
      enum:
      - resize
      - fit_canvas
      default: resize
    display_name: Resize or canvas mode
  - name: canvas_color
    value_type: text
    schema:
      type: string
      default: white
    display_name: Canvas color
  outputs: &id001
  - name: image_artifact_handle
    value_type: artifact_handle
  - name: width
    value_type: number
  - name: height
    value_type: number
  - name: original_width
    value_type: number
  - name: original_height
    value_type: number
  - name: has_transparency
    value_type: boolean
  - name: processing_method
    value_type: text
  - name: size_bytes
    value_type: number
  error_codes: &id002
  - invalid_payload
  - invalid_dimensions
  - input_too_large
  - invalid_image
  - unsupported_image
  - invalid_resize_mode
  - invalid_canvas_color
  - image_too_large
  - output_too_large
  - artifact_access_failed
  - model_unavailable
  - processing_failed
- operation_id: remove_background
  display_name: Remove an image background
  description: Use the bundled U2-NetP CPU model to create a transparent PNG at the source dimensions. Existing
    transparency can be preserved without running segmentation; inspect difficult edges before use.
  operation_kind: action
  category: image_processing
  connection_type_ids: []
  inputs:
  - name: artifact_handle
    value_type: artifact_handle
    required: true
    display_name: Source image artifact
  - name: keep_existing_transparency
    value_type: boolean
    display_name: Preserve existing transparency without segmentation
  outputs: *id001
  error_codes: *id002
- operation_id: check_size
  display_name: Inspect image dimensions
  description: Read an image artifact and compare it with target dimensions. Returns dimensions and resize/padding
    flags for workflow branching without creating a new image.
  operation_kind: action
  category: image_processing
  connection_type_ids: []
  inputs:
  - name: artifact_handle
    value_type: artifact_handle
    required: true
    display_name: Source image artifact
  - name: target_width
    value_type: number
    schema:
      type: number
      minimum: 1
      maximum: 8192
      default: 2048
    display_name: Target width (pixels)
  - name: target_height
    value_type: number
    schema:
      type: number
      minimum: 1
      maximum: 8192
      default: 2048
    display_name: Target height (pixels)
  outputs:
  - name: width
    value_type: number
  - name: height
    value_type: number
  - name: target_width
    value_type: number
  - name: target_height
    value_type: number
  - name: exact_match
    value_type: boolean
  - name: fits_within_target
    value_type: boolean
  - name: needs_resize
    value_type: boolean
  - name: needs_padding
    value_type: boolean
  - name: recommended_resize_mode
    value_type: text
  error_codes: *id002
